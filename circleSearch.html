<!doctype html>
<html lang="ja">
    <head>
        <!-- GoogleTag -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-0CL1H2HGPL"></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag() {
                dataLayer.push(arguments);
            }
            gtag("js", new Date());
            gtag("config", "G-0CL1H2HGPL");
        </script>

        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" href="/favicon.ico" />
        <script src="/theme.js"></script>
        <link rel="stylesheet" href="/style.css" />
        <link rel="stylesheet" href="/circleSearch.css" />
        <link rel="canonical" href="https://gakuson.com/circleSearch.html" />

        <meta property="og:site_name" content="がくそん" />
        <title>サークル検索 - がくそん</title>
        <meta property="og:title" content="サークル検索 - がくそん" />
        <meta name="description" content="がくそんに登録されている南山大学のサークルを見ることができます。" />
        <meta property="og:description" content="がくそんに登録されている南山大学のサークルを見ることができます。" />
    </head>
    <body>
        <header></header>
        <script>
            (async () => {
                const res = await fetch("/header.html");
                document.querySelector("header").innerHTML = await res.text();
            })();
        </script>

        <!-- ここより下に書いてください -->
        <div class="userChoiceContainer">
            <p>検索条件</p>
            <div class="selectorsContainer">
                <select id="clubType">
                    <option value="all" selected>種別: すべて</option>
                    <option value="sports">運動系</option>
                    <option value="cultural">文化系</option>
                    <option value="committee">委員会</option>
                </select>
                <select id="clubSize">
                    <option value="1-999" selected>規模: すべて</option>
                    <option value="1-5">5人以下</option>
                    <option value="6-10">6-10人</option>
                    <option value="11-20">11-20人</option>
                    <option value="21-30">21-30人</option>
                    <option value="31-50">31-50人</option>
                    <option value="51-999">51人以上</option>
                </select>
            </div>

            <div class="selectorsContainer">
                <select id="genre">
                    <option value="all" selected>ジャンル: すべて</option>
                </select>
                <select id="sortOrder">
                    <option value="nameAsc" selected>名前 - 昇順</option>
                    <option value="nameDesc">名前 - 降順</option>
                    <option value="activityHigh">活動頻度 - 高い順</option>
                    <option value="activityLow">活動頻度 - 低い順</option>
                    <option value="membersHigh">人数 - 多い順</option>
                    <option value="membersLow">人数 - 少ない順</option>
                    <option value="feeHigh">部費 - 高い順</option>
                    <option value="feeLow">部費 - 安い順</option>
                </select>
            </div>

            <div class="PC_ONLY" style="margin-top: 4rem; padding: 1rem 0; text-align: center; font-size: 0.8rem; color: var(--pColor); background: #ccc">
                あなたのサークルを<br />掲載しませんか？<br />お気軽にお問合せください！
            </div>
        </div>
        <div class="clubSearchResults"><!-- ここに検索結果が入る --></div>
        <script src="circleSearch.js"></script>

        <!-- ここより上に書いてください -->
        <footer></footer>
        <script>
            (async () => {
                const res = await fetch("/footer.html");
                document.querySelector("footer").innerHTML = await res.text();
            })();
        </script>
    </body>
</html>
